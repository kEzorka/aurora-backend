# Four containers, one per V100, behind nothing. Adding a load balancer in
# front is a two-line change; leaving it out keeps the thing being tested here
# visible, which is that the containers are independent and share nothing but
# a read-only archive.
#
# Every port is published on 127.0.0.1 and not on 0.0.0.0, which is the one
# thing here that is a security decision rather than a deployment one. The API
# has no authentication, so a published port is an open GPU: `POST /forecast`
# holds a card for minutes and writes up to 11 GB, and it takes no credential
# to call. A host firewall is not a substitute — Docker writes its publishing
# rules into the DOCKER chain, which iptables traverses before INPUT, so a
# `ufw deny 8000` on this box would not have covered it. Reach these over an
# SSH tunnel:
#
#   ssh -L 8000:localhost:8000 <host>
#
# See SECURITY.md.
#
# This file is the deployment the README already prescribes ("one uvicorn
# worker per GPU with AURORA_DEVICE=cuda:N"), written down. Containerising does
# not change the process model — it packages it.

x-worker: &worker
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: aurora-backend:latest
  restart: unless-stopped
  volumes:
    # Read-only: see the Dockerfile comment. The archive is the expensive
    # artefact on this box.
    - ${AURORA_DATA_DIR:-/home/kostya/data}:/data:ro
    - ${AURORA_CACHE_DIR:-/home/kostya/.cache/huggingface}:/cache/huggingface
    - ${AURORA_OUTPUT_DIR:-/home/kostya/outputs}:/outputs
  environment: &env
    # Always cuda:0 — each container is given exactly one card by device_ids
    # below, and inside the container that card is device 0 whichever physical
    # GPU it is.
    AURORA_DEVICE: cuda:0
    AURORA_AUTOCAST: ${AURORA_AUTOCAST:-off}

# A forecast holds ~24 GiB of VRAM in fp32 and ~19 GiB in fp16, so one container
# per card and no oversubscription — measured: two fp16 workers on one V100 die
# with an out-of-memory, they do not merely run slowly.
#
# The pinning has to be `device_ids` and nothing else. Reserving GPUs through
# the `deploy` block and *also* setting NVIDIA_VISIBLE_DEVICES does not compose:
# the toolkit honours the reservation, the env var is ignored, and every
# container ends up on the same physical card.

services:
  aurora-0:
    <<: *worker
    ports: ["127.0.0.1:8000:8000"]
    environment: *env
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, device_ids: ["0"], capabilities: [gpu]}]

  aurora-1:
    <<: *worker
    ports: ["127.0.0.1:8001:8000"]
    environment: *env
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, device_ids: ["1"], capabilities: [gpu]}]

  aurora-2:
    <<: *worker
    ports: ["127.0.0.1:8002:8000"]
    environment: *env
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, device_ids: ["2"], capabilities: [gpu]}]

  aurora-3:
    <<: *worker
    ports: ["127.0.0.1:8003:8000"]
    environment: *env
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, device_ids: ["3"], capabilities: [gpu]}]
