# Four containers, one per V100, behind nothing. Adding a load balancer in
# front is a two-line change; leaving it out keeps the thing being tested here
# visible, which is that the containers are independent and share nothing but
# a read-only archive.
#
# This file is the deployment the README already prescribes ("one uvicorn
# worker per GPU with AURORA_DEVICE=cuda:N"), written down. Containerising does
# not change the process model — it packages it.

x-worker: &worker
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: aurora-backend:latest
  restart: unless-stopped
  volumes:
    # Read-only: see the Dockerfile comment. The archive is the expensive
    # artefact on this box.
    - ${AURORA_DATA_DIR:-/home/kostya/data}:/data:ro
    - ${AURORA_CACHE_DIR:-/home/kostya/.cache/huggingface}:/cache/huggingface
    - ${AURORA_OUTPUT_DIR:-/home/kostya/outputs}:/outputs
  # A forecast holds ~24 GiB of VRAM in fp32 and ~19 GiB in fp16, so one
  # container per card and no oversubscription. `device_ids` is what pins it;
  # without it every container sees every GPU and they all pile onto cuda:0.
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            capabilities: [gpu]

services:
  aurora-0:
    <<: *worker
    ports: ["8000:8000"]
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      AURORA_DEVICE: cuda:0
      AURORA_AUTOCAST: ${AURORA_AUTOCAST:-off}

  aurora-1:
    <<: *worker
    ports: ["8001:8000"]
    environment:
      NVIDIA_VISIBLE_DEVICES: "1"
      AURORA_DEVICE: cuda:0
      AURORA_AUTOCAST: ${AURORA_AUTOCAST:-off}

  aurora-2:
    <<: *worker
    ports: ["8002:8000"]
    environment:
      NVIDIA_VISIBLE_DEVICES: "2"
      AURORA_DEVICE: cuda:0
      AURORA_AUTOCAST: ${AURORA_AUTOCAST:-off}

  aurora-3:
    <<: *worker
    ports: ["8003:8000"]
    environment:
      NVIDIA_VISIBLE_DEVICES: "3"
      AURORA_DEVICE: cuda:0
      AURORA_AUTOCAST: ${AURORA_AUTOCAST:-off}
