name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/test-minimal.txt
          # Тесты фикстур GRIB пропускаются без cfgrib (importorskip), и без
          # этой строки CI молча не проверял бы ни одну из четырёх ловушек на
          # настоящих данных. На Linux x86 pip-колёса eccodes ставятся сразу.
          pip install "cfgrib>=0.9.14" "eccodes>=2.38"

      - name: ruff
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: mypy
        run: mypy .

      # Ни один тест не ходит в сеть (docs/TESTING.md). Маркер network
      # исключён явно, чтобы это было видно, а не подразумевалось.
      - name: pytest
        run: pytest -m "not network and not gpu"
