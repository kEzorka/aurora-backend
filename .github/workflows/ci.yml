name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/test-minimal.txt

      - name: ruff
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: mypy
        run: mypy .

      # Ни один тест не ходит в сеть (docs/TESTING.md). Маркер network
      # исключён явно, чтобы это было видно, а не подразумевалось.
      - name: pytest
        run: pytest -m "not network and not gpu"
